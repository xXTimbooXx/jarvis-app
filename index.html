<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060b">
<title>Jarvis</title>
<style>
  :root {
    --h: 276;
    --akzent: hsl(var(--h) 90% 74%);
    --gedimmt: hsl(var(--h) 30% 58%);
    --linie: hsl(var(--h) 60% 45% / 0.55);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #07060b;
    color: var(--akzent);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 14px);
    overflow: hidden;
  }
  header {
    display: flex;
    justify-content: space-between;
    padding: 18px 20px 0;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--gedimmt);
  }
  #buehne { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #status { text-align: center; padding: 0 20px; }
  #titel {
    font-size: clamp(30px, 9vw, 46px);
    letter-spacing: 0.32em;
    padding-left: 0.32em;
    text-shadow: 0 0 26px hsl(var(--h) 100% 60% / 0.55);
  }
  #text {
    color: var(--gedimmt);
    font-size: 15px;
    line-height: 1.5;
    margin: 10px auto 18px;
    max-width: 280px;
    min-height: 46px;
  }
  #knoepfe {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 0 14px;
  }
  button {
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--akzent);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--linie);
    padding: 14px 20px;
    cursor: pointer;
  }
  button.aktiv {
    background: hsl(var(--h) 70% 50% / 0.22);
    border-color: var(--akzent);
    box-shadow: 0 0 18px hsl(var(--h) 100% 55% / 0.3);
  }
  #farbe { border-style: dashed; margin-top: 12px; }
  #farbzeile { display: flex; justify-content: center; }
</style>
</head>
<body>
<header><span>J.A.R.V.I.S.</span><span id="uhr">--:--</span></header>
<div id="buehne"><canvas id="orb"></canvas></div>
<div id="status">
  <div id="titel">BEREIT</div>
  <div id="text">Tippe auf Sprechen und rede los.</div>
</div>
<div id="knoepfe">
  <button id="b-sprechen" class="aktiv">Sprechen</button>
</div>
<div id="farbzeile"><button id="farbe">Farbe: Lila</button></div>

<script src="schluessel.js"></script>
<script src="teil1.js"></script>
<script src="teil2.js"></script>
<script src="teil3.js"></script>

</body>
</html>
